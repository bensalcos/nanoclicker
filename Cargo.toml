[workspace]
members = ["crates/core", "crates/platform", "crates/app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
thiserror = "2.0.18"
nanoclick-core = { path = "crates/core" }
nanoclick-platform = { path = "crates/platform" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
debug = "line-tables-only"
strip = "none"
