name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux graphics and isolated test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libx11-dev libxi-dev libxrandr-dev xvfb xauth dbus-daemon
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: python -m unittest discover -s scripts -p "test*package.py" -v
      - run: cargo build --release --locked -p nanoclick
      - name: Build Windows passive QA target
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p nanoclick --example input_capture
      - name: Package and verify Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package.py --platform windows --preview --output dist/ci-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_windows_package.py dist/ci-windows --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist/ci-windows/qa | Out-Null
          Copy-Item target/release/examples/input_capture.exe dist/ci-windows/qa/
          python -c "import sys; sys.path.insert(0, 'scripts'); from pathlib import Path; from windows_imports import verify_portable_runtime; print(verify_portable_runtime(Path('dist/ci-windows/qa/input_capture.exe').read_bytes()))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @{commit=$env:GITHUB_SHA;sha256=(Get-FileHash dist/ci-windows/qa/input_capture.exe -Algorithm SHA256).Hash;scope='Passive QA target; use notices and license from the accompanying preview ZIP'} | ConvertTo-Json | Set-Content dist/ci-windows/qa/build.json
      - name: Preserve Windows preview and separate symbols
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-preview
          path: dist/ci-windows/
          if-no-files-found: ignore
          retention-days: 14
      - name: Isolated X11 events and shortcuts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          python3 -m unittest discover -s scripts -p test_x11_fixture.py -v 2>&1 | tee artifacts/x11-fixture.log
          cargo clippy -p nanoclick-platform --example ui_x11_acceptance --features x11-tests --locked -- -D warnings
          scripts/verify-x11.sh 2>&1 | tee artifacts/x11.log
          NANOCLICK_UI_STRESS_CYCLES=20 scripts/verify-ui-x11.sh target/release/nanoclick 2>&1 | tee artifacts/ui-x11.log
          cargo clippy -p nanoclick-platform --example capture_window --features x11-tests --locked -- -D warnings
          scripts/verify-input-capture.sh 2>&1 | tee artifacts/input-capture.log
      - name: Isolated X11 stalled-server cancellation
        if: runner.os == 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          cargo clippy -p nanoclick-platform --example x11_stall --features x11-tests --locked -- -D warnings
          python3 scripts/verify-x11-stall.py 2>&1 | tee artifacts/x11-stall.log
      - name: Isolated portal lifecycle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo clippy -p nanoclick-platform --example portal_lifecycle --features portal-tests --locked -- -D warnings
          scripts/verify-portal.sh 2>&1 | tee artifacts/portal.log
      - name: Preserve diagnostic evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: x11-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  renderer:
    name: Alternative renderer / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - run: cargo clippy -p nanoclick --all-targets --no-default-features --features wgpu --locked -- -D warnings
      - run: cargo test -p nanoclick --no-default-features --features wgpu --locked

  msrv:
    name: Minimum Rust / 1.95
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 check --workspace --locked
