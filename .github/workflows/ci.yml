name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux graphics and isolated test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev libgl1-mesa-dev libx11-dev libxi-dev libxrandr-dev xvfb xauth
      - name: Install pinned toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: python -m unittest discover -s scripts -p "test*package.py" -v
      - run: cargo build --release --locked -p nanoclick
      - name: Package and verify Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package.py --platform windows --preview --output dist/ci-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_windows_package.py dist/ci-windows --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve Windows preview and separate symbols
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-preview
          path: dist/ci-windows/
          if-no-files-found: error
          retention-days: 14
      - name: Isolated X11 events and shortcuts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p artifacts
          scripts/verify-x11.sh 2>&1 | tee artifacts/x11.log
          scripts/verify-ui-x11.sh 2>&1 | tee artifacts/ui-x11.log
      - name: Preserve diagnostic evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: x11-evidence
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

  renderer:
    name: Alternative renderer / Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - run: cargo clippy -p nanoclick --all-targets --no-default-features --features wgpu --locked -- -D warnings
      - run: cargo test -p nanoclick --no-default-features --features wgpu --locked

  msrv:
    name: Minimum Rust / 1.95
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 check --workspace --locked
