[package]
name = "nanoclick"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nanoclick-core.workspace = true
nanoclick-platform.workspace = true

eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "default_fonts", "wayland", "x11"] }
global-hotkey = "0.9.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
directories = "6.0.0"
thiserror.workspace = true

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu"] }

[target.'cfg(not(windows))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow"] }

[features]
default = []
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]

[dev-dependencies]
raw-window-handle = "0.6.2"
