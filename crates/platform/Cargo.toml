[package]
name = "nanoclick-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
nanoclick-core.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["xtest", "xkb"] }
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "remote_desktop", "global_shortcuts", "screencast"] }
async-io = "2.6"
futures-lite = "2.6"
async-channel = "2.5"
global-hotkey = "0.9.0"
rustix = { version = "1.1.5", features = ["event"] }

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey = "0.9.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }

[features]
x11-tests = []
portal-tests = []

[target.'cfg(target_os = "linux")'.dev-dependencies]
serde_json = "1.0"
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }

[[example]]
name = "portal_lifecycle"
required-features = ["portal-tests"]

[[example]]
name = "x11_acceptance"
required-features = ["x11-tests"]

[[example]]
name = "ui_x11_acceptance"
required-features = ["x11-tests"]

[[example]]
name = "ui_performance"
required-features = ["x11-tests"]

[[example]]
name = "x11_stall"
required-features = ["x11-tests"]
